# Render Blueprint: one click creates the database, the API and the website.
# Names must be unique on Render. If one is taken, change it here AND in the two URLs below.
databases:
  - name: asd-sujil-db
    databaseName: autism
    user: autism
    plan: free

services:
  - type: web
    name: asd-sujil-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py seed_demo && gunicorn config.wsgi:application --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: asd-sujil-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://asd-sujil-web.onrender.com

  - type: web
    name: asd-sujil-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        value: https://asd-sujil-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
